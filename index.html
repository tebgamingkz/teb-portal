<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D0F13">
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>TEB Портал</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: mobile-first app shell — sticky header, scrolling view, bottom tab bar; sheets slide up from the bottom. */
:root{
  --bg:#0D0F13; --surface:#151820; --surface2:#1C2029; --line:#272C37; --fg:#E8EBF1; --muted:#8B93A5;
  --accent:#4D6BFF; --accent-soft:rgba(77,107,255,.16); --on-accent:#FFFFFF;
  --good:#2CC38B; --good-soft:rgba(44,195,139,.14); --warn:#F0A93A; --warn-soft:rgba(240,169,58,.15);
  --bad:#F25A5F; --bad-soft:rgba(242,90,95,.15);
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px; color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#F2F3F7; --surface:#FFFFFF; --surface2:#F1F3F8; --line:#E0E3EB; --fg:#11141B; --muted:#5C6578;
  --accent:#3452E6; --accent-soft:rgba(52,82,230,.10); --on-accent:#FFFFFF;
  --good:#12925F; --good-soft:rgba(18,146,95,.11); --warn:#B76E00; --warn-soft:rgba(183,110,0,.11);
  --bad:#D2343A; --bad-soft:rgba(210,52,58,.10); color-scheme:light; } }
:root[data-theme="light"]{
  --bg:#F2F3F7; --surface:#FFFFFF; --surface2:#F1F3F8; --line:#E0E3EB; --fg:#11141B; --muted:#5C6578;
  --accent:#3452E6; --accent-soft:rgba(52,82,230,.10); --on-accent:#FFFFFF;
  --good:#12925F; --good-soft:rgba(18,146,95,.11); --warn:#B76E00; --warn-soft:rgba(183,110,0,.11);
  --bad:#D2343A; --bad-soft:rgba(210,52,58,.10); color-scheme:light; }

/* skins chosen per person in the header — override the system theme */
html:root[data-skin="dark"]{
  --bg:#0D0F13; --surface:#151820; --surface2:#1C2029; --line:#272C37; --fg:#E8EBF1; --muted:#8B93A5;
  --accent:#4D6BFF; --accent-soft:rgba(77,107,255,.16); --on-accent:#FFFFFF;
  --good:#2CC38B; --good-soft:rgba(44,195,139,.14); --warn:#F0A93A; --warn-soft:rgba(240,169,58,.15);
  --bad:#F25A5F; --bad-soft:rgba(242,90,95,.15); color-scheme:dark }
html:root[data-skin="light"]{
  --bg:#F2F3F7; --surface:#FFFFFF; --surface2:#F1F3F8; --line:#E0E3EB; --fg:#11141B; --muted:#5C6578;
  --accent:#3452E6; --accent-soft:rgba(52,82,230,.10); --on-accent:#FFFFFF;
  --good:#12925F; --good-soft:rgba(18,146,95,.11); --warn:#B76E00; --warn-soft:rgba(183,110,0,.11);
  --bad:#D2343A; --bad-soft:rgba(210,52,58,.10); color-scheme:light }
html:root[data-skin="lux"]{
  --bg:#F4F4F2; --surface:#FFFFFF; --surface2:#EEEFEF; --line:#DADCDE; --fg:#0E1013; --muted:#6B7078;
  --accent:#0E1013; --accent-soft:rgba(14,16,19,.07); --on-accent:#FFFFFF;
  --good:#1F7A57; --good-soft:rgba(31,122,87,.10); --warn:#9A6A1E; --warn-soft:rgba(154,106,30,.10);
  --bad:#B3262E; --bad-soft:rgba(179,38,46,.09); color-scheme:light }
html:root[data-skin="lux"] body{background:linear-gradient(180deg,#FBFBFA 0%,#F1F1EF 100%) fixed}
html:root[data-skin="lux"] #top{border-bottom:1px solid transparent;border-image:linear-gradient(90deg,transparent,#B9BEC4 20%,#E9ECEF 50%,#B9BEC4 80%,transparent) 1}
html:root[data-skin="lux"] .panel,html:root[data-skin="lux"] .kpi,html:root[data-skin="lux"] .bcard,html:root[data-skin="lux"] .row{box-shadow:0 1px 0 rgba(255,255,255,.9) inset,0 6px 18px -12px rgba(14,16,19,.25)}
html:root[data-skin="lux"] .total,html:root[data-skin="lux"] .bhero{background:linear-gradient(135deg,#1A1D22 0%,#0B0C0E 55%,#2A2E34 100%);color:#F4F4F2;box-shadow:0 0 0 1px #3A3F46 inset,0 14px 30px -18px rgba(0,0,0,.6)}
html:root[data-skin="lux"] .btn.primary{background:linear-gradient(180deg,#24272C,#0B0C0E);box-shadow:0 0 0 1px #3A3F46 inset}
html:root[data-skin="lux"] .brand::after{content:"";display:inline-block;width:22px;height:2px;margin-left:8px;vertical-align:middle;background:linear-gradient(90deg,#8E959D,#E9ECEF,#8E959D);border-radius:2px}
html:root[data-skin="pink"]{
  --bg:#FFF4F8; --surface:#FFFFFF; --surface2:#FDEAF1; --line:#F5D2DF; --fg:#2A1320; --muted:#8C6275;
  --accent:#E0337A; --accent-soft:rgba(224,51,122,.12); --on-accent:#FFFFFF;
  --good:#16935F; --good-soft:rgba(22,147,95,.11); --warn:#B86A00; --warn-soft:rgba(184,106,0,.11);
  --bad:#D3263A; --bad-soft:rgba(211,38,58,.10); color-scheme:light }
html:root[data-skin="ny"]{
  --bg:#0C1712; --surface:#12221A; --surface2:#182D22; --line:#244232; --fg:#F4F1E6; --muted:#A7B7A6;
  --accent:#E0383F; --accent-soft:rgba(224,56,63,.18); --on-accent:#FFFFFF;
  --good:#45C483; --good-soft:rgba(69,196,131,.15); --warn:#E8B64C; --warn-soft:rgba(232,182,76,.16);
  --bad:#FF6B6B; --bad-soft:rgba(255,107,107,.16); color-scheme:dark }
html:root[data-skin="ny"] body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;
  background-image:radial-gradient(2px 2px at 20px 30px,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 90px 120px,#fff 50%,transparent 51%),radial-gradient(2.5px 2.5px at 160px 60px,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 230px 170px,#fff 50%,transparent 51%),radial-gradient(2px 2px at 60px 200px,#fff 50%,transparent 51%);
  background-size:260px 240px;animation:snow 18s linear infinite}
html:root[data-skin="ny"] .brand::after{content:"🎄";font-size:15px;margin-left:2px}
@keyframes snow{from{background-position:0 0}to{background-position:40px 240px}}
@media (prefers-reduced-motion:reduce){html:root[data-skin="ny"] body::after{animation:none}}
#view{position:relative;z-index:1}
.skins{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.skin{border:2px solid var(--line);border-radius:16px;padding:10px;cursor:pointer;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:8px}
.skin[aria-pressed="true"]{border-color:var(--accent)}
.skin .sw{height:64px;border-radius:10px;display:flex;align-items:flex-end;gap:6px;padding:8px}
.skin .sw i{display:block;height:10px;border-radius:99px}
.skin b{font-size:14px}
.iconbtn{border:1px solid var(--line);background:var(--surface2);width:36px;height:36px;border-radius:10px;cursor:pointer;display:grid;place-items:center;color:var(--fg);flex:none}
.iconbtn svg{width:18px;height:18px}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{margin:0;text-wrap:balance}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
#top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px;min-height:56px}
.brand{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.02em;display:flex;align-items:baseline;gap:6px}
.brand small{font-family:var(--f-body);font-weight:700;font-size:10px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.who img{width:30px;height:30px;border-radius:50%;flex:none}
.role-chip{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.viewas{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:13px;max-width:150px}

#view{padding-block:16px 120px}
.view{display:flex;flex-direction:column;gap:16px}

/* tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#tabs .wrap{display:flex;justify-content:space-around;gap:4px;padding-block:6px}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border:0;background:none;color:var(--muted);font-size:11px;font-weight:600;border-radius:10px;cursor:pointer;position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-current="true"]{color:var(--fg)}
.tab[aria-current="true"] svg{color:var(--accent)}
.tab .dot{position:absolute;top:3px;right:calc(50% - 18px);min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--bad);color:#fff;font-size:10px;line-height:16px;font-weight:700}
.ico{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* generic */
.section-h{display:flex;align-items:center;gap:10px}
.section-h h2{font-family:var(--f-display);font-weight:500;font-size:15px;letter-spacing:.01em}
.section-h .spacer{flex:1}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:var(--surface2)}
.row .main{flex:1;min-width:0}
.row .t1{font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .t2{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .side{text-align:right;font-size:12px;color:var(--muted);flex:none}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.03em;padding:3px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.dotc{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .n{font-family:var(--f-mono);font-size:11px;opacity:.7;margin-left:4px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer;min-height:42px}
.btn:hover{border-color:var(--muted)}
a.btn{text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:19;width:54px;height:54px;border-radius:18px;border:0;background:var(--accent);color:var(--on-accent);box-shadow:0 8px 24px rgba(0,0,0,.35);cursor:pointer;display:grid;place-items:center}
.fab svg{width:26px;height:26px}

/* form */
.form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.inp{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;min-height:44px}
textarea.inp{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.check{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer;background:var(--surface)}
.check input{accent-color:var(--accent)}
.check:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:620px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--f-mono);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted)}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.goal .big{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.01em}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:99px}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.5}
.goal-row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.goal-row strong{color:var(--fg)}

.sig{display:flex;gap:10px;padding:12px 14px;border-top:1px solid var(--line);align-items:flex-start}
.sig:first-child{border-top:0}
.sig .mark{width:4px;align-self:stretch;border-radius:4px;flex:none}
.sig.bad .mark{background:var(--bad)} .sig.warn .mark{background:var(--warn)} .sig.good .mark{background:var(--good)}
.sig .tt{font-weight:700;font-size:14px}
.sig .dd{font-size:13px;color:var(--muted)}

.chart{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:420px;height:auto}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}

.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.tbl table{border-collapse:collapse;width:100%;min-width:560px;font-size:13px}
.tbl th,.tbl td{padding:9px 10px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
.tbl th{border-top:0;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--surface2)}
.tbl td:first-child,.tbl th:first-child{text-align:left}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface2)}
.tbl .pos{color:var(--good)} .tbl .neg{color:var(--bad)}

/* steps */
.steps{display:flex;gap:4px}
.steps span{flex:1;height:5px;border-radius:99px;background:var(--surface2)}
.steps span.on{background:var(--accent)}
.steps span.done{background:var(--good)}
.stepper{display:flex;flex-direction:column;gap:8px}
html[data-bg]{background:linear-gradient(color-mix(in srgb,var(--bg) 52%,transparent),color-mix(in srgb,var(--bg) 70%,transparent)),var(--user-bg) center/cover fixed no-repeat,var(--bg)!important}
html[data-bg] body,html[data-bg] #view,html[data-bg] main{background:transparent!important}
.btrack{display:flex;align-items:center;gap:0}
.btrack .bt{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:11px;font-weight:700;color:var(--muted);text-align:center}
.btrack .bt::before{content:"";position:absolute;top:50%;left:-50%;width:100%;height:3px;background:var(--surface2);z-index:0}
.btrack.big .bt::before{top:15px}
.btrack .bt:first-child::before{display:none}
.btrack .bt.done::before,.btrack .bt.on::before{background:var(--good)}
.btrack .bt i{font-style:normal;position:relative;z-index:1;width:14px;height:14px;border-radius:99px;background:var(--surface2);display:grid;place-items:center;font-size:0}
.btrack.big .bt i{width:30px;height:30px;font-size:12px;font-family:var(--f-mono);border:2px solid var(--line);background:var(--surface)}
.btrack .bt.done i{background:var(--good);border-color:var(--good);color:#fff}
.btrack .bt.on i{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:0 0 0 5px var(--accent-soft)}
.btrack .bt.on{color:var(--fg)}
.bpanel{border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(180deg,var(--surface),var(--surface2))}
.bpanel.done{border-color:var(--good)}
.bstage{display:flex;flex-direction:column;gap:10px}
.bnext{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));z-index:3;box-shadow:0 8px 24px rgba(0,0,0,.18)}
@media(max-width:600px){.stepitem{padding:13px 12px;min-height:52px}.stepitem .box{width:26px;height:26px}.bpanel{padding:12px;border-radius:16px}.btrack.big .bt span{font-size:10px}}
.bstage-h{display:flex;align-items:center;gap:12px;justify-content:space-between}
.bstage-h h3{margin:2px 0 0;font-family:var(--f-display);font-size:22px;font-weight:600}
.bring{--p:0;width:58px;height:58px;border-radius:99px;flex:none;display:grid;place-items:center;background:conic-gradient(var(--good) calc(var(--p)*1%),var(--surface2) 0)}
.bring span{width:46px;height:46px;border-radius:99px;background:var(--surface);display:grid;place-items:center;font-size:13px;font-weight:700}
.stepitem .tip{font-size:12px;font-weight:500;color:var(--muted);margin-top:2px}
.stepitem.on>div>div:first-child{text-decoration:line-through;text-decoration-color:var(--good);opacity:.75}
.bcards{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:760px){.bcards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bcard{border:1px solid var(--line);border-radius:18px;padding:16px;background:var(--surface);display:flex;flex-direction:column;gap:12px;text-align:left;cursor:pointer;color:inherit;font:inherit;width:100%}
.bcard:hover{border-color:var(--accent)}
.bcard .bn{font-family:var(--f-mono);font-size:22px;font-weight:700}
.bcard .bp{font-weight:700;font-size:15px}
.bcard .bmeta{display:flex;gap:6px;flex-wrap:wrap}
.bcard .bfoot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.bhero{border-radius:20px;padding:20px;background:var(--fg);color:var(--bg);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.bhero .v{font-family:var(--f-mono);font-size:28px;font-weight:700;line-height:1.1}
.bhero .l{font-size:12px;opacity:.65;font-weight:600}
.defect{display:flex;flex-direction:column;gap:8px}
.defect .meter{position:relative;height:12px;border-radius:99px;background:linear-gradient(90deg,var(--good) 0 30%,var(--warn) 30% 60%,var(--bad) 60%)}
.defect .meter b{position:absolute;top:-5px;width:4px;height:22px;border-radius:4px;background:var(--fg);transform:translateX(-2px)}
.defect .meter .lim{position:absolute;top:16px;font-size:11px;color:var(--muted);transform:translateX(-50%)}

.stepitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);cursor:pointer;font-weight:600}
.stepitem .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;flex:none}
.stepitem.on .box{background:var(--good);border-color:var(--good)}
.stepitem.on .box::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.stepitem.on{color:var(--fg)}

/* chat */
.msgs{display:flex;flex-direction:column;gap:8px}
.msg{max-width:84%;align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 11px}
.msg.me{align-self:flex-end;background:var(--accent-soft);border-color:transparent;border-radius:14px 14px 4px 14px}
.msg .by{font-size:11px;font-weight:700;color:var(--accent);margin-bottom:2px}
.msg .tx{white-space:pre-wrap;overflow-wrap:anywhere}
.msg .at{font-size:10px;color:var(--muted);text-align:right;margin-top:2px;font-family:var(--f-mono)}
.msg.sys{align-self:center;background:none;border:0;color:var(--muted);font-size:12px;text-align:center}
.composer{position:sticky;bottom:calc(68px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;padding:10px 0;background:var(--bg)}
.composer .inp{flex:1}
.sheet-composer{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 0 4px;background:var(--surface)}
.sheet-composer .inp{flex:1}

.media{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.media a,.media div{aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface2);display:block;max-width:100%}
.media img,.media video{width:100%;height:100%;object-fit:cover;display:block}

.sched{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.sched table{border-collapse:collapse;width:100%;min-width:480px;font-size:13px}
.sched th,.sched td{padding:8px 6px;text-align:center;border-top:1px solid var(--line)}
.sched th{border-top:0;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.sched td:first-child,.sched th:first-child{text-align:left;padding-left:12px;font-weight:600;white-space:nowrap}
.cell{width:34px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;font-size:11px;font-weight:700;color:var(--muted)}
.cell.on{background:var(--good-soft);border-color:transparent;color:var(--good)}
.cell:disabled{cursor:default}

/* sheet */
#sheetWrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
#sheetWrap .scrim{position:absolute;inset:0;background:rgba(5,6,9,.6)}
#sheet{position:relative;width:100%;max-width:760px;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;border:1px solid var(--line);border-bottom:0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#sheet{animation:none}}
.grab{width:42px;height:5px;border-radius:99px;background:var(--line);margin:4px auto 2px}
.sheet-h{display:flex;align-items:flex-start;gap:10px}
.sheet-h h3{font-family:var(--f-display);font-weight:500;font-size:18px;flex:1;min-width:0;overflow-wrap:anywhere}
.x{border:0;background:var(--surface2);width:34px;height:34px;border-radius:10px;cursor:pointer;flex:none;display:grid;place-items:center;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.note{border-top:1px solid var(--line);padding-top:8px;font-size:14px}
.note .meta{font-size:11px;color:var(--muted)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;max-width:calc(100% - 32px);text-align:center}

/* whatsapp-style preview */
.wa{background:var(--surface2);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.wa .bubble{align-self:flex-end;max-width:100%;background:var(--good-soft);border-radius:14px 14px 4px 14px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.5}
.wa .bubble b{font-weight:800}
.desk2{display:flex;flex-direction:column;gap:16px}
.desk2>*{min-width:0;display:flex;flex-direction:column;gap:16px}

/* desktop */
@media (min-width:1024px){
  body{font-size:15px}
  #top .wrap{max-width:none;padding-left:24px;padding-right:24px}
  #tabs{top:57px;bottom:0;left:0;right:auto;width:232px;border-top:0;border-right:1px solid var(--line);padding-bottom:0;overflow-y:auto}
  #tabs .wrap{flex-direction:column;justify-content:flex-start;gap:2px;padding:14px 12px;max-width:none}
  .tab{flex:none;width:100%;flex-direction:row;justify-content:flex-start;gap:12px;font-size:14px;padding:10px 12px}

  .tab[aria-current="true"]{background:var(--accent-soft)}

  #view.wrap{max-width:1240px;margin:0 0 0 232px;padding-left:36px;padding-right:36px;padding-block:28px 48px}
  .fab{bottom:32px;right:36px}
  .composer{bottom:0}
  #toast{bottom:28px}
  #sheetWrap{justify-content:flex-end;align-items:stretch}
  #sheet{max-width:600px;max-height:none;height:100%;border-radius:0;border:0;border-left:1px solid var(--line);padding:20px 28px 28px;animation:side .2s ease-out}
  .grab{display:none}
  .kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
  .desk2{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px;align-items:start}
  .desk2>.stick{position:sticky;top:80px}
  .kpis.two{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis.two .kpi .v{font-size:24px}
  .list .row{padding:13px 18px}
}
@keyframes side{from{transform:translateX(40px);opacity:.6}to{transform:none;opacity:1}}



.bonus{border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;background:linear-gradient(160deg,var(--surface2),var(--surface));border:1px dashed var(--warn)}

.total{border-radius:18px;padding:18px;background:var(--fg);color:var(--bg);display:flex;flex-direction:column;gap:4px}
.total .eyebrow{color:inherit;opacity:.65}
.total-v{font-family:var(--f-mono);font-weight:600;font-size:36px;letter-spacing:-.02em;line-height:1.1}

.gate{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:16px;padding-block:40px}

.hint{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:13px}
.copy{cursor:copy;user-select:all}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TZ='Asia/Almaty';
const fmtKey=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'});
const dayKey=ts=>fmtKey.format(new Date(ts));
const todayKey=()=>dayKey(Date.now());
const fmtDay=k=>{if(!k)return'';const[y,m,d]=k.split('-');return d+'.'+m};
const fmtTime=ts=>new Intl.DateTimeFormat('ru-RU',{timeZone:TZ,hour:'2-digit',minute:'2-digit'}).format(new Date(ts));
const fmtDT=ts=>new Intl.DateTimeFormat('ru-RU',{timeZone:TZ,day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(ts)).replace(',','');
const fmtDate=ts=>new Intl.DateTimeFormat('ru-RU',{timeZone:TZ,day:'numeric',month:'long',weekday:'long'}).format(new Date(ts));
const nfmt=n=>Math.round(n||0).toLocaleString('ru-RU').replace(/ | /g,' ');
const money=n=>nfmt(n)+' ₸';
const mln=n=>{const a=Math.abs(n);if(a>=1e6)return(n/1e6).toFixed(a>=1e7?1:2).replace('.',',')+' млн';if(a>=1e3)return Math.round(n/1e3)+' тыс';return nfmt(n)};
const usd=n=>'$'+(Math.round((n||0)*100)/100).toLocaleString('en-US');
const ago=ts=>{if(!ts)return'';const m=Math.round((Date.now()-ts)/60000);if(m<1)return'только что';if(m<60)return m+' мин';const h=Math.round(m/60);if(h<48)return h+' ч';return Math.round(h/24)+' дн'};
const H=3600e3;
function addDays(k,n){const d=new Date(k+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}

function mixCalc(cash,part,via){
  part=Math.max(0,Math.min(+part||0,cash));const div=via==='halyk'?.77:.85;
  const restCash=cash-part;const inst=restCash>0?up1k(restCash/div):0;
  return{part,via:via==='halyk'?'halyk':'kaspi',restCash,inst,total:part+inst,m24:inst?ceil(inst/24):0,m12:inst?ceil(inst/12):0};
}

  const missing=[...(k&&!k.custom&&base==null?[k.name]:[]),...upPrices.filter(x=>x[1]==null).map(x=>x[0].name)];

/* ---------- boot ---------- */
async function boot(){
  const C=window.claude;
  if(!C||!C.use){S.err='Не загрузилась база. Проверьте интернет и обновите страницу.';return paint()}
  const [db,user,assets,downloads]=await Promise.all([C.use('db'),C.use('user'),C.use('assets'),C.use('downloads')]);
  S.db=db;S.user=user;S.assets=assets;S.downloads=downloads;
  if(!db){S.err='Войдите через Google, чтобы открыть портал.';return paint()}
  if(user){
    S.me=await user.me();S.uid=S.me.id;
    S.isAdmin=!!(S.me.isOwner||S.me.canEdit);
  }
  if(!S.isAdmin)S.viewAs=null;
  const timer=setTimeout(()=>{if(!S.ready){S.ready=true;S.slow=true;paint()}},10000);
  const done=name=>{S.loaded.add(name);if(!S.ready&&['team','orders'].every(n=>S.loaded.has(n))){S.ready=true;clearTimeout(timer)}schedulePaint()};
  const subCol=(name,q,map)=>q.onSnapshot(snap=>{map(snap.docs.map(d=>({id:d.id,...d.data()})));if(!snap.metadata.fromCache)done(name);else schedulePaint()},e=>{done(name)});
  subCol('team',col('team'),a=>S.team=a.sort((x,y)=>(x.name||'').localeCompare(y.name||'','ru')));
  subCol('orders',col('orders').orderBy('createdAt','desc').limit(500),a=>S.orders=a);
  subCol('notes',col('notes').orderBy('updatedAt','desc').limit(1000),a=>S.notes=a);
  subCol('incidents',col('incidents').orderBy('createdAt','desc').limit(200),a=>S.incidents=a);
  subCol('stock',col('stock'),a=>S.stock=a.sort((x,y)=>(x.cat||'').localeCompare(y.cat||'','ru')||(x.name||'').localeCompare(y.name||'','ru')));
  subCol('kits',col('kits'),a=>S.kits=a);
  subCol('upgrades',col('upgrades'),a=>S.upgrades=a.sort((x,y)=>(x.order??999)-(y.order??999)));
  subCol('chat',col('chat').orderBy('at','desc').limit(150),a=>S.chat=a.reverse());
  subCol('mchat',col('mchat').orderBy('at','desc').limit(150),a=>S.mchat=a.reverse());
  doc('config/main').onSnapshot(s=>{if(s.exists)S.config={...S.config,...s.data()};schedulePaint()},()=>{});
  doc('config/plan').onSnapshot(s=>{S.plan=s.exists?(s.data().days||{}):{};schedulePaint()},()=>{});
  subCol('paylog',col('paylog'),a=>{S.paylog=Object.fromEntries(a.map(d=>[d.id,d.days||{}]))});
  subCol('goals',col('goals'),a=>{S.goals=Object.fromEntries(a.map(d=>[d.id,d]))});
  doc('config/bonus').onSnapshot(s=>{S.bonus=s.exists?s.data():{};schedulePaint()},()=>{});
  doc('schedule/week').onSnapshot(s=>{S.schedule=s.exists?(s.data().members||{}):{};schedulePaint()},()=>{});
  if(S.isAdmin){
    subCol('requests',col('requests'),a=>S.requests=a);
    subCol('days',col('days'),a=>{S.days=Object.fromEntries(a.map(d=>[d.id,d]))});
    subCol('expenses',col('expenses').orderBy('date','desc').limit(500),a=>S.expenses=a);
    subCol('margins',col('margins'),a=>{S.margins=Object.fromEntries(a.map(d=>[d.id,d]))});
    subCol('costs',col('costs'),a=>{S.costs=Object.fromEntries(a.map(d=>[d.id,d]))});
  } else if(S.uid){
    doc('requests/'+S.uid).onSnapshot(s=>{S.myReq=s.exists?s.data():null;schedulePaint()},()=>{});
  }
  paint();
}
let paintQ=false;
function schedulePaint(){if(paintQ)return;paintQ=true;requestAnimationFrame(()=>{paintQ=false;paint()})}

/* keep typed text across re-renders */
function preserve(root,fn){
  const a=document.activeElement;const keep={};
  root.querySelectorAll('[data-keep]').forEach(el=>{if(el.id)keep[el.id]=el.value});
  const fid=a&&root.contains(a)&&a.id?a.id:null;let sel=null;
  if(fid&&a.selectionStart!=null){try{sel=[a.selectionStart,a.selectionEnd]}catch(e){}}
  const sc=root.scrollTop;fn();root.scrollTop=sc;
  for(const id in keep){const el=document.getElementById(id);if(el&&root.contains(el))el.value=keep[id]}
  if(fid){const el=document.getElementById(fid);if(el){el.focus({preventScroll:true});if(sel)try{el.setSelectionRange(...sel)}catch(e){}}}
}

/* ---------- metrics ---------- */
function dayStats(k){
  const d=S.days[k]||{};
  const os=S.orders.filter(o=>o.stage!=='cancelled'&&dayKey(o.createdAt)===k);
  const mSum=os.reduce((a,o)=>a+(S.margins[o.id]?.margin!=null?+S.margins[o.id].margin:(suggestMargin(o)||0)),0);
  const exp=S.expenses.filter(e=>e.date===k).reduce((a,e)=>a+(+e.amount||0),0);
  const orders=d.orders!=null?+d.orders:os.length;
  const margin=d.margin!=null?+d.margin:mSum;
  const adUsd=+d.adUsd||0, msgs=+d.msgs||0, ad=adUsd*rate(), other=(+d.other||0)+exp;
  return{k,orders,margin,adUsd,msgs,ad,other,net:margin-ad-other,fact:d.margin!=null||os.length>0};
}
function periodSum(k){
  const sd=+S.config.startDay||5;const p=periodOf(k,sd);const keys=keysBetween(p.s,p.e);const t=todayKey();
  const rows=keys.map(dayStats);
  const sum=f=>rows.filter(r=>r.k<=t).reduce((a,r)=>a+r[f],0);
  const net=sum('net');const goal=+S.config.goal||0;
  const left=keys.filter(x=>x>=t&&!(S.days[x]&&S.days[x].margin!=null)).length||1;
  const need=Math.max(0,goal-net)/left;
  const elapsed=keys.filter(x=>x<=t).length;
  return{p,keys,rows,net,goal,left,need,elapsed,margin:sum('margin'),ad:sum('ad'),adUsd:sum('adUsd'),msgs:sum('msgs'),other:sum('other'),orders:sum('orders')};
}
function signals(){
  const out=[];const t=todayKey();const now=Date.now();
  if(S.isAdmin){
    const P=periodSum(t);
    const last=[1,2,3].map(i=>dayStats(addDays(t,-i)));
    const avg3=last.reduce((a,r)=>a+r.net,0)/3;
    if(P.net<P.goal){
      if(avg3<P.need*0.7)out.push(['bad','Темп ниже цели',`Последние 3 дня в среднем ${mln(avg3)} в день, а до цели нужно ${mln(P.need)} в день.`]);
      else if(avg3>=P.need)out.push(['good','Идём в темпе цели',`3 дня в среднем ${mln(avg3)} в день при нужных ${mln(P.need)}.`]);
    } else out.push(['good','Цель месяца закрыта',`Чистыми ${mln(P.net)} при цели ${mln(P.goal)}.`]);
    const y=dayStats(addDays(t,-1));
    const wk=[...Array(7)].map((_,i)=>dayStats(addDays(t,-1-i))).filter(r=>r.msgs>0);
    if(y.msgs>0){
      const cpl=y.adUsd/y.msgs;
      if(cpl>10)out.push(['bad','Дорогие заявки вчера',`${usd(cpl)} за сообщение — выше порога $10. Проверьте креативы.`]);
      else if(cpl<=6)out.push(['good','Дешёвые заявки вчера',`${usd(cpl)} за сообщение. Можно добавить бюджет на лучшие объявления.`]);
      const conv=y.orders/y.msgs;const avgConv=wk.reduce((a,r)=>a+r.orders,0)/Math.max(1,wk.reduce((a,r)=>a+r.msgs,0));
      if(avgConv>0&&conv<avgConv*0.6)out.push(['bad','Просела конверсия в продажу',`Вчера ${Math.round(conv*100)}% диалогов купили, обычно ${Math.round(avgConv*100)}%. Разберите отказы с менеджерами.`]);
      else if(avgConv>0&&conv>avgConv*1.3)out.push(['good','Сильная конверсия вчера',`${Math.round(conv*100)}% диалогов купили при среднем ${Math.round(avgConv*100)}%.`]);
    }
    const w1=[...Array(7)].reduce((a,_,i)=>a+dayStats(addDays(t,-1-i)).net,0);
    const w0=[...Array(7)].reduce((a,_,i)=>a+dayStats(addDays(t,-8-i)).net,0);
    if(w0>0&&w1<w0*0.75)out.push(['warn','Неделя слабее прошлой',`${mln(w1)} за 7 дней против ${mln(w0)} неделей раньше.`]);
    else if(w0>0&&w1>w0*1.15)out.push(['good','Неделя сильнее прошлой',`${mln(w1)} за 7 дней против ${mln(w0)}.`]);
    const best=P.rows.filter(r=>r.k<t).sort((a,b)=>b.net-a.net)[0];
    if(best&&best.net>0)out.push(['good',`Лучший день месяца — ${fmtDay(best.k)}`,`${best.orders} заказов, ${mln(best.net)} чистыми. Повторите, что сработало.`]);
  }
  const stuck=S.orders.filter(o=>{const age=now-(o.stageAt||o.createdAt||now);return(o.stage==='queue'&&age>24*H)||(IN_BUILD.includes(o.stage)&&age>24*H)||(o.stage==='packed'&&age>24*H)});
  if(stuck.length)out.push(['warn',`${stuck.length} заказ(ов) застряли больше суток`,stuck.slice(0,4).map(o=>`№${o.num||'—'} — ${stage(o).t}`).join(', ')]);
  const cash=S.orders.filter(o=>o.courier?.status==='paid'&&now-(o.courier.paidAt||now)>12*H);
  if(cash.length)out.push(['bad','Курьер не сдал деньги больше 12 часов',cash.map(o=>`№${o.num} — ${money(o.courier.paidAmount)}`).join(', ')]);
  const incOld=S.incidents.filter(i=>i.status!=='done'&&(i.severity==='high'||now-i.createdAt>24*H));
  if(incOld.length)out.push(['bad',`${incOld.length} инцидент(ов) требуют внимания`,incOld.slice(0,3).map(i=>i.title).join(' · ')]);
  const over=S.notes.filter(n=>n.status!=='done'&&n.remindAt&&n.remindAt<now);
  if(over.length){const by={};over.forEach(n=>{const k=nameOf(n.createdBy);by[k]=(by[k]||0)+1});
    out.push(['warn',`${over.length} клиентам не написали вовремя`,'Просроченные заметки: '+Object.entries(by).map(([k,v])=>`${k} — ${v}`).join(', ')+'. Каждый час ожидания снижает шанс продажи.'])}
  const low=S.stock.filter(s=>+s.min>0&&+s.qty<=+s.min);
  if(low.length)out.push(['warn',`Заканчивается на складе: ${low.length}`,low.slice(0,4).map(s=>`${s.name} (${s.qty})`).join(', ')]);
  const order={bad:0,warn:1,good:2};
  return out.sort((a,b)=>order[a[0]]-order[b[0]]);
}

function netChart(P){
  const rows=P.rows;const t=todayKey();
  const W=Math.max(420,rows.length*22+50),Hh=200,top=14,bot=26,left=44,right=8;
  const vals=rows.map(r=>r.k<=t?r.net:0);
  const maxV=Math.max(P.need,...vals,1),minV=Math.min(0,...vals);
  const y=v=>top+(maxV-v)/(maxV-minV)*(Hh-top-bot);
  const bw=(W-left-right)/rows.length;
  let g='';
  [maxV,maxV/2,0].forEach(v=>{g+=`<line x1="${left}" x2="${W-right}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${left-6}" y="${y(v)+3}" text-anchor="end">${esc(mln(v))}</text>`});
  rows.forEach((r,i)=>{
    const x=left+i*bw+bw*.18,w=bw*.64;const v=vals[i];
    if(r.k<=t&&(r.fact||r.ad)){const y0=y(Math.max(0,v)),h=Math.abs(y(v)-y(0));
      const fill=v<0?'var(--bad)':(v>=P.need?'var(--good)':'var(--accent)');
      g+=`<rect x="${x}" y="${y0}" width="${w}" height="${Math.max(1.5,h)}" rx="3" fill="${fill}"><title>${fmtDay(r.k)}: ${mln(v)}</title></rect>`}
    else if(r.k>t){g+=`<rect x="${x}" y="${y(0)-2}" width="${w}" height="2" rx="1" fill="var(--line)"/>`}
    if(i%2===0||rows.length<16)g+=`<text x="${x+w/2}" y="${Hh-8}" text-anchor="middle" ${r.k===t?'style="fill:var(--fg);font-weight:600"':''}>${r.k.slice(8)}</text>`;
  });
  if(P.need>0)g+=`<line x1="${left}" x2="${W-right}" y1="${y(P.need)}" y2="${y(P.need)}" stroke="var(--warn)" stroke-dasharray="4 4" stroke-width="1.5"/><text x="${W-right}" y="${y(P.need)-5}" text-anchor="end" style="fill:var(--warn)">нужно ${esc(mln(P.need))}/день</text>`;
  return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Чистая прибыль по дням периода">${g}</svg>`;
}

const bBuilds=(mid,k)=>S.orders.filter(o=>o.builtAt&&o.stage!=='cancelled'&&builtBy(o)===mid&&dayKey(o.builtAt)===k);
function bWorked(mid,k){const wd=(new Date(k+'T12:00:00Z').getUTCDay()+6)%7;if((S.schedule[mid]||[])[wd])return true;
  return S.orders.some(o=>(o.history||[]).some(h=>h.by===mid&&dayKey(h.at)===k))}

VIEW.bpay=()=>{

   <div class="kpi"><span class="eyebrow">Сборки</span><span class="v">${td.builds} × 3 000</span><span class="s">+${nfmt(td.extra)} ₸ · каждая готовая +3 000</span></div></div>

/* ---------- salary ---------- */
const PAY_BASE=4000,PAY_PLAN=8000,PAY_SALE=2000;
const isClub=o=>/клуб/i.test([o.product,o.num,o.client].join(' '));
const soldBy=o=>o.soldBy||o.createdBy;
const portalSales=k=>S.orders.filter(o=>o.stage!=='cancelled'&&!isClub(o)&&dayKey(o.createdAt)===k);
const planOf=k=>+(S.plan[k]?.plan??0);
const teamSales=k=>{const f=S.plan[k]?.fact;const n=portalSales(k).length;return f!=null&&f!==''?Math.max(+f,n):n};
function worked(mid,k){const wd=(new Date(k+'T12:00:00Z').getUTCDay()+6)%7;if((S.schedule[mid]||[])[wd])return true;
  return portalSales(k).some(o=>soldBy(o)===mid)||S.notes.some(n=>n.createdBy===mid&&dayKey(n.createdAt||0)===k)}
const payStart=()=>S.config.payStart||'2026-11-16';
function payDay(mid,k){const L=(S.paylog[mid]||{})[k]||{};const team=teamSales(k),plan=planOf(k);const pm=portalSales(k).filter(o=>soldBy(o)===mid).length;const mine=L.sales!=null?Math.max(+L.sales,pm):pm;let w=L.w!=null?!!L.w:(worked(mid,k)||mine>0);if(k<payStart())w=false;
  const met=plan>0&&team>=plan;const base=w?(met?PAY_PLAN:PAY_BASE):0;return{k,team,plan,mine,w,met,base,extra:mine*PAY_SALE,total:base+mine*PAY_SALE}}

function goalForm(mid){const g=S.goals[mid]||{};const quick=[300000,500000,700000,1000000];
  return `<form class="panel form" data-form="goal" data-id="${esc(mid)}"><div class="section-h"><h2>🎯 Моя цель на месяц</h2></div>

   <div class="field"><label for="dreamIn">Моя мечта / зачем мне эти деньги</label><textarea class="inp" name="dream" id="dreamIn" data-keep rows="3" placeholder="Например: накопить на машину, закрыть кредит, подарок маме">${esc(g.dream||'')}</textarea></div>

function goalCard(mid,month,td,daysLeft,editable){
  const G=S.goals[mid]||{};const g=+(G.amount||0);
  if(!g||S.f.goalEdit===mid)return editable?goalForm(mid):'<div class="panel muted small">Менеджер ещё не поставил цель.</div>';

    <div class="kpi"><span class="eyebrow">Нужно в рабочий день</span><span class="v">${money(Math.ceil(perDay/1000)*1000)}</span><span class="s">оклад + продажи</span></div>
    <div class="kpi"><span class="eyebrow">Продаж в день</span><span class="v">${salesIfPlan}</span><span class="s">если команда закрывает план · иначе ${salesNoPlan}</span></div>

    <div>Уже заработано: <b class="num">${money(before)}</b>${td.total?` + сегодня ${money(td.total)}`:''}</div>

  </div>`;

function msgHtml(m,me){
  if(m.sys)return `<div class="msg sys">${esc(m.text)} · ${fmtTime(m.at)}</div>`;
  const mine=m.by===me;
  return `<div class="msg ${mine?'me':''}">${mine?'':`<div class="by">${esc(nameOf(m.by))}</div>`}<div class="tx">${esc(m.text)}</div><div class="at">${fmtDT(m.at)}</div></div>`;
}

function myCourierCity(){const r=role();if(r==='courier'&&!S.isAdmin)return member()?.city||null;return S.f.courier}
VIEW.courier=()=>{
  const city=myCourierCity();const adminish=S.isAdmin;
  const all=S.orders.filter(o=>o.courierCity&&(!city||o.courierCity===city));
  const act=all.filter(o=>['packed','shipped','delivered'].includes(o.stage)&&(o.courier?.status||'wait')!=='handed');
  const handed=all.filter(o=>o.courier?.status==='handed').slice(0,15);
  const cashNow=act.filter(o=>o.courier?.status==='paid').reduce((a,o)=>a+(+o.courier.paidAmount||0),0);
  const step=o=>{const c=o.courier||{};const s=c.status||'wait';
    const steps=[['wait','Получить посылку','recv'],['received','Назначить время','time'],['scheduled','Принять оплату','pay'],['paid','Передать деньги','hand']];
    const cur=steps.find(x=>x[0]===s)||steps[0];
    return `<div class="panel" style="display:flex;flex-direction:column;gap:10px">
     <div style="display:flex;gap:10px;align-items:flex-start"><div style="flex:1;min-width:0">
       <div class="t1" style="font-weight:800;display:flex;gap:8px;flex-wrap:wrap"><span class="num">№${esc(o.num)}</span><span class="pill ${s==='paid'?'warn':''}">${esc({wait:'Ждёт отправки',received:'У курьера',scheduled:'Доставка назначена',paid:'Оплата у курьера'}[s])}</span></div>
       <div class="muted small" style="margin-top:2px">${esc([o.client,o.address||o.city].filter(Boolean).join(' · '))}</div>
       ${o.phone?`<div class="small num copy" style="margin-top:4px">${esc(o.phone)}</div>`:''}
     </div><div style="text-align:right"><div class="num" style="font-weight:700;white-space:nowrap">${money(dueOf(o))}</div><div class="muted small">${o.paid==='partial'?'остаток':'к оплате'}</div></div></div>
     <div class="small">${esc(deliveryLine(o))}</div>
     ${c.deliveryAt?`<div class="small">Доставка: <b class="num">${fmtDT(c.deliveryAt)}</b></div>`:''}
     ${c.paidAmount?`<div class="small">Принято: <b class="num">${money(c.paidAmount)}</b> · ${esc(c.paidMethod||'')}</div>`:''}
     <div class="steps">${steps.map((x,i)=>`<span class="${steps.indexOf(cur)>i?'done':steps.indexOf(cur)===i?'on':''}"></span>`).join('')}</div>
     <button class="btn primary block" data-act="cour" data-step="${cur[2]}" data-id="${esc(o.id)}">${esc(cur[1])}</button>
    </div>`};
  return `<div class="section-h"><h2>Доставки${city?' · '+esc(city):''}</h2></div>
  ${adminish?`<div class="chips">${[null,...CITIES].map(c=>`<button class="chip" data-act="fCour" data-v="${c||''}" aria-pressed="${(S.f.courier||null)===c}">${c||'Все города'}</button>`).join('')}</div>`:''}
  <div class="kpis"><div class="kpi"><span class="eyebrow">Заказов на руках</span><span class="v">${act.length}</span></div>
  <div class="kpi"><span class="eyebrow">Деньги у вас</span><span class="v" style="color:${cashNow?'var(--warn)':'inherit'}">${money(cashNow)}</span><span class="s">сдать в компанию</span></div></div>
  ${act.length?act.map(step).join(''):'<div class="panel empty">Новых доставок нет. Заказы с оплатой при получении появятся здесь после упаковки.</div>'}
  ${handed.length?`<div class="section-h"><h2>Сдано</h2></div><div class="list">${handed.map(o=>`<button class="row" data-act="openOrder" data-id="${esc(o.id)}"><div class="main"><div class="t1 num">№${esc(o.num)}</div><div class="t2">${esc(o.courier.handedMethod||'')}</div></div><div class="side num">${money(o.courier.paidAmount)}<div>${o.courier.handedAt?fmtDT(o.courier.handedAt):''}</div></div></button>`).join('')}</div>`:''}`;
};

};

VIEW.money=()=>{
  const t=todayKey();const sd=+S.config.startDay||5;
  const keys=Object.keys(S.days).concat(S.orders.map(o=>dayKey(o.createdAt||Date.now()))).concat([t]);
  const periods=[...new Set(keys.map(k=>periodOf(k,sd).s))].sort().reverse();
  const cur=S.f.money&&periods.includes(S.f.money)?S.f.money:periodOf(t,sd).s;
  const P=periodSum(cur);
  const rows=P.rows.filter(r=>r.k<=t);
  const exps=S.expenses.filter(e=>e.date>=P.p.s&&e.date<=P.p.e);
  const cpl=P.msgs?P.adUsd/P.msgs:0;
  return `<div class="section-h"><h2>Финансы</h2><span class="spacer"></span><button class="btn sm" data-act="cfg">Цель и курс</button></div>
  <div class="chips">${periods.map(s=>{const p=periodOf(s,sd);return `<button class="chip" data-act="fMoney" data-v="${s}" aria-pressed="${s===cur}">${fmtDay(p.s)}–${fmtDay(p.e)}</button>`}).join('')}</div>
  <div class="kpis">
   <div class="kpi"><span class="eyebrow">Чистыми</span><span class="v">${mln(P.net)}</span><span class="s">цель ${mln(P.goal)}</span></div>
   <div class="kpi"><span class="eyebrow">Маржа</span><span class="v">${mln(P.margin)}</span><span class="s">${P.orders} заказов</span></div>
   <div class="kpi"><span class="eyebrow">Реклама</span><span class="v">${mln(P.ad)}</span><span class="s">${usd(P.adUsd)} · ${usd(cpl)}/сообщ.</span></div>
   <div class="kpi"><span class="eyebrow">Прочие расходы</span><span class="v">${mln(P.other)}</span><span class="s">ЗП, Kaspi, аренда</span></div>
  </div>
  <div class="panel chart">${netChart(P)}</div>
  <div class="section-h"><h2>По дням</h2><span class="spacer"></span><button class="btn sm" data-act="editDay" data-k="${t}">${icon('plus')}День</button></div>
  <div class="tbl"><table><thead><tr><th>Дата</th><th>Заказы</th><th>Маржа</th><th>Реклама</th><th>Сообщ.</th><th>$/сообщ.</th><th>Прочее</th><th>Чистыми</th></tr></thead><tbody>
  ${rows.slice().reverse().map(r=>`<tr class="click" data-act="editDay" data-k="${r.k}"><td>${fmtDay(r.k)}</td><td class="num">${r.orders}</td><td class="num">${nfmt(r.margin)}</td><td class="num">${usd(r.adUsd)}</td><td class="num">${r.msgs}</td><td class="num">${r.msgs?usd(r.adUsd/r.msgs):'—'}</td><td class="num">${nfmt(r.other)}</td><td class="num ${r.net<0?'neg':'pos'}">${nfmt(r.net)}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="section-h"><h2>Расходы периода</h2><span class="spacer"></span><button class="btn sm" data-act="newExp">${icon('plus')}Расход</button></div>
  <div class="list">${exps.length?exps.map(e=>`<button class="row" data-act="editExp" data-id="${esc(e.id)}"><div class="main"><div class="t1">${esc(e.cat)}${e.memberId?` · ${esc(nameOf(e.memberId))}`:''}</div><div class="t2">${esc(e.note||'')}</div></div><div class="side"><div class="num" style="color:var(--fg);font-weight:700">${money(e.amount)}</div><div>${fmtDay(e.date)}</div></div></button>`).join(''):'<div class="empty">Расходов за период нет. Зарплаты, бонусы и Kaspi-маркетинг добавляйте сюда.</div>'}</div>
  <p class="muted small">Маржа дня берётся из строки дня, если она заполнена; иначе — сумма маржи заказов, внесённых в портал. Реклама считается по курсу ${rate()} ₸ за $.</p>`;
};

function schedTable(edit){

  if(!ms.length)return '<div class="panel empty">Добавьте сотрудников, чтобы составить график.</div>';
  return `<div class="sched"><table><thead><tr><th>Сотрудник</th>${WEEK.map(d=>`<th>${d}</th>`).join('')}</tr></thead><tbody>
  ${ms.map(m=>`<tr><td>${esc(m.name)}</td>${WEEK.map((d,i)=>{const on=!!(S.schedule[m.id]||[])[i];return `<td><button class="cell ${on?'on':''}" ${edit?`data-act="sched" data-id="${esc(m.id)}" data-i="${i}"`:'disabled'} aria-label="${esc(m.name)} ${d}">${on?'смена':'—'}</button></td>`}).join('')}</tr>`).join('')}
  </tbody></table></div>`;
}
VIEW.sched=()=>{const m=member();const my=m?(S.schedule[m.id]||[]):[];

function openSheet(type,arg,live=false){if(type!=='incident'&&S.incUnsub){S.incUnsub();S.incUnsub=null}S.sheet={type,arg,live};paintSheet(true)}
function closeSheet(){if(S.incUnsub){S.incUnsub();S.incUnsub=null}S.sheet=null;$('#sheetWrap').hidden=true;$('#sheet').innerHTML=''}
function paintSheet(first){
  if(!S.sheet)return;const el=$('#sheet');
  const html=SHEET[S.sheet.type]?.(S.sheet.arg);
  if(html==null){closeSheet();return}
  const body=`<div class="grab"></div>${html}`;
  if(first){el.innerHTML=body;$('#sheetWrap').hidden=false;el.scrollTop=0;recalcOrderForm(el.querySelector('form[data-form="order"]'));const f=el.querySelector('[autofocus]');if(f)f.focus()}
  else preserve(el,()=>el.innerHTML=body);
}
const head=(t,sub)=>`<div class="sheet-h"><div style="flex:1;min-width:0"><h3>${t}</h3>${sub?`<div class="muted small">${sub}</div>`:''}</div><button class="x" data-act="closeSheet" aria-label="Закрыть">${icon('x')}</button></div>`;
const opt=(v,t,cur)=>`<option value="${esc(v)}" ${String(cur??'')===String(v)?'selected':''}>${esc(t)}</option>`;

SHEET.order=id=>{
  const o=S.orders.find(x=>x.id===id);if(!o)return null;
  const r=role();const me=whoId();const adm=S.isAdmin;const k=kitOf(o.kitId);
  const isMine=o.builderId===me;const canBuild=S.isAdmin||(r==='builder'?(isMine||(!o.builderId&&o.stage==='queue')):isLead());
  const canManage=['admin','manager'].includes(r);
  const done=SETUP.filter(([x])=>o.setup?.[x]).length;
  let actions='';
  if(o.stage==='queue'){
    if(r==='builder'&&!o.builderId&&isLead())actions+=`<button class="btn primary" data-act="take" data-id="${esc(o.id)}">Взять в сборку</button>`;
    if(canBuild&&o.builderId)actions+=`<button class="btn primary" data-act="startBuild" data-id="${esc(o.id)}">Начал сборку</button>`;
    if(isLead())actions+=`<button class="btn" data-act="assign" data-id="${esc(o.id)}">${o.builderId?'Переназначить':'Назначить сборщика'}</button>`;
  }
  if(o.stage==='packed'&&canManage&&!o.courierCity)actions+=o.delivery==='pickup'?`<button class="btn good" data-act="pickup" data-id="${esc(o.id)}">Выдан клиенту</button>`:`<button class="btn primary" data-act="ship" data-id="${esc(o.id)}">Отправлен</button>`;
  if(o.stage==='shipped'&&canManage&&!o.courierCity)actions+=`<button class="btn good" data-act="delivered" data-id="${esc(o.id)}">Доставлен</button>`;
  if(canManage&&o.stage!=='cancelled'&&o.stage!=='delivered')actions+=`<button class="btn" data-act="editOrder" data-id="${esc(o.id)}">Изменить</button>`;
  if(canManage||S.isAdmin)actions+=`<button class="btn" data-act="warrantyPdf" data-id="${esc(o.id)}">📄 Скачать гарантию</button>`;
  if(canManage)actions+=`<button class="btn" data-act="copyOrder" data-id="${esc(o.id)}">Скопировать заказ клиенту</button>`;
  actions+=`<button class="btn" data-act="incFromOrder" data-id="${esc(o.id)}">Инцидент</button>`;
  if(canManage&&o.stage!=='cancelled'&&o.stage!=='delivered')actions+=`<button class="btn danger" data-act="cancelOrder" data-id="${esc(o.id)}">Отменить</button>`;
  const mg=S.margins[o.id];const sugg=suggestMargin(o);
  const media=o.media||[];
  const c=o.courier||{};
  return `${head(`Заказ №${esc(o.num||'—')}`,`${pillStage(o)} · создан ${o.createdAt?fmtDT(o.createdAt):''} · ${esc(nameOf(o.createdBy))}`)}
  ${r!=='manager'&&(WORK_ST.includes(o.stage)||o.builtAt)?buildPanel(o,canBuild&&!!o.builderId):''}
  <dl class="kv">
   <dt>Товар</dt><dd>${esc(o.product||k?.name||'—')}</dd>
   ${o.caseModel||o.caseColor?`<dt>Корпус</dt><dd>${esc(o.caseModel||o.caseColor)}</dd>`:''}
   ${o.kaspiNum?`<dt>Kaspi №</dt><dd class="num copy">${esc(o.kaspiNum)}</dd>`:''}
   ${o.client?`<dt>Клиент</dt><dd>${esc(o.client)}</dd>`:''}
   ${o.phone?`<dt>Телефон</dt><dd class="num copy">${esc(o.phone)}</dd>`:''}
   <dt>Город</dt><dd>${esc(o.city||'—')}${o.address?' · '+esc(o.address):''}</dd>
   <dt>Получение</dt><dd>${esc(deliveryLine(o))}</dd>
   <dt>Оплата</dt><dd>${esc(PAY[o.payType]||'—')}${o.amount?' · <span class="num">'+money(o.amount)+'</span>':''} ${o.paid==='partial'?`<span class="pill warn">оплачено ${mln(o.prepaid||0)}, остаток ${mln(dueOf(o))}</span>`:isCOD(o)?`<span class="pill warn">при получении ${mln(dueOf(o))}</span>`:'<span class="pill good">оплачено</span>'}</dd>
   ${(o.gifts||[]).length?`<dt>Подарки</dt><dd>${esc(o.gifts.join(', '))}</dd>`:''}
   <dt>Сборщик</dt><dd>${o.builderId?esc(nameOf(o.builderId)):'не назначен'}</dd>
   ${o.ship?`<dt>Отправка</dt><dd>${esc(SHIP[o.ship]||o.ship)}${o.track?' · '+esc(o.track):''}</dd>`:''}
   ${o.courierCity?`<dt>Курьер</dt><dd>${esc(o.courierCity)} · ${esc({wait:'ждёт',received:'у курьера',scheduled:'назначено '+(c.deliveryAt?fmtDT(c.deliveryAt):''),paid:'оплата у курьера '+money(c.paidAmount),handed:'деньги сданы: '+(c.handedMethod||'')}[c.status||'wait'])}</dd>`:''}
   ${o.stockDeducted?`<dt>Склад</dt><dd>комплектующие списаны</dd>`:''}
  </dl>
  <div class="btns">${actions}</div>
  ${canManage&&o.stage!=='cancelled'?invoiceBlock(o):''}
  ${k&&!k.custom?`<details ${o.stage==='queue'&&role()==='builder'?'open':''}><summary class="eyebrow" style="cursor:pointer">Комплектация</summary><div style="margin-top:8px">${specsHtml(k,(o.upgrades||[]).map(upOf).filter(Boolean))}</div></details>`:''}
  <div class="section-h"><div class="eyebrow">Фото и видео сборки · ${media.length}</div><span class="spacer"></span>
   ${S.assets?`<label class="btn sm" for="up-${esc(o.id)}">${icon('cam')}Добавить</label><input type="file" id="up-${esc(o.id)}" accept="image/*,video/*" multiple hidden data-change="upload" data-id="${esc(o.id)}">`:''}</div>
  ${media.length?`<div class="media">${media.map(m=>m.type&&m.type.startsWith('video')?`<div><video src="/_blob/${esc(m.id)}" controls preload="metadata" playsinline></video></div>`:`<a href="/_blob/${esc(m.id)}" target="_blank" rel="noopener"><img src="/_blob/${esc(m.id)}" alt="Фото сборки" loading="lazy"></a>`).join('')}</div>`:`<div class="muted small">${S.assets?'Снимите сборку и упаковку — клиенту отправим перед отгрузкой.':'Загрузка фото недоступна в этом окне.'}</div>`}
  ${adm?`<div class="eyebrow">Маржа (видит только админ)</div>
   <form class="form" data-form="margin" data-id="${esc(o.id)}" style="flex-direction:row;gap:8px"><input class="inp num" id="mg-${esc(o.id)}" name="margin" inputmode="numeric" data-keep value="${esc(mg?.margin??'')}" placeholder="${sugg!=null?'≈ '+nfmt(sugg):'Маржа, ₸'}"><button class="btn" type="submit">Сохранить</button></form>
   ${sugg!=null?`<div class="muted small">${mg?.margin==null?'Считается автоматически: ':'Авторасчёт: '}цена × ${PAY_F[o.payType]||1} − себестоимость (комплект + апгрейды) − подарки − 10 000 = <b class="num">${nfmt(sugg)}</b>. Впишите своё число, если отличается.</div>`:'<div class="muted small">Себестоимость не задана — впишите маржу вручную.</div>'}`:''}
  <div class="eyebrow">Примечания</div>
  ${(o.notes||[]).map(n=>`<div class="note"><div>${esc(n.t)}</div><div class="meta">${esc(nameOf(n.by))} · ${fmtDT(n.at)}</div></div>`).join('')||'<div class="muted small">Пока нет.</div>'}
  <form class="sheet-composer" data-form="note" data-id="${esc(o.id)}"><input class="inp" id="note-${esc(o.id)}" name="t" data-keep placeholder="Примечание к заказу…" autocomplete="off"><button class="btn primary" type="submit" aria-label="Добавить">${icon('send')}</button></form>
  ${(o.history||[]).length?`<details><summary class="muted small" style="cursor:pointer">История (${o.history.length})</summary>${o.history.slice().reverse().map(h=>`<div class="note"><div class="small">${esc(h.t)}</div><div class="meta">${esc(nameOf(h.by))} · ${fmtDT(h.at)}</div></div>`).join('')}</details>`:''}`;
};

function invoiceBlock(o){
  const inv=o.invoice;
  if(inv&&inv.status==='sent')return `<div class="panel" style="display:flex;flex-direction:column;gap:8px;border-color:var(--warn)">
    <div class="section-h"><h2>💳 Счёт Kaspi отправлен</h2><span class="spacer"></span><span class="pill warn">ждём оплату</span></div>
    <div class="small">${money(inv.amount)} на номер <span class="num">${esc(inv.phone)}</span> · ${fmtDT(inv.at)} · ${esc(nameOf(inv.by))}</div>
    <div class="btns"><button class="btn good" data-act="invoicePaid" data-id="${esc(o.id)}">Оплачен ✓</button><button class="btn sm" data-act="invoiceMsg" data-id="${esc(o.id)}">Напомнить клиенту</button><button class="btn sm danger" data-act="invoiceCancel" data-id="${esc(o.id)}">Отменить</button></div></div>`;
  if(o.paid==='paid')return inv&&inv.status==='paid'?`<div class="small muted">💳 Счёт Kaspi на ${money(inv.amount)} оплачен ${inv.paidAt?fmtDT(inv.paidAt):''}</div>`:'';
  return `<div class="btns"><button class="btn" data-act="invoice" data-id="${esc(o.id)}">💳 Выставить счёт Kaspi${o.paid==='partial'?' (доплата)':' (предоплата)'}</button>${inv&&inv.status==='paid'?`<span class="small muted" style="align-self:center">прошлый счёт ${money(inv.amount)} оплачен</span>`:''}</div>`;
}

async function downloadWarranty(o,fmt){

    else{blob=await new Promise(r=>c.toBlob(r,'image/png'));name=`Гарантия TEB №${o.num}.png`}
    await S.downloads.save({filename:name,data:blob});toast('Гарантия скачана')}
  catch(e){if(e&&e.code==='declined')return;toast(e&&e.message==='pdf'?'PDF не загрузился — скачайте картинкой':'Не получилось скачать')}

function suggestMargin(o){
  if(!o.amount)return null;
  const kc=costOf('kit_'+o.kitId);
  if(kc==null)return o.amount>1e6?150000:null;
  let c=kc;for(const u of (o.upgrades||[])){const uc=costOf('up_'+u);if(uc==null)return null;c+=uc}
  const g=(o.gifts||[]).reduce((a,x)=>a+(GIFTS[x]||0),0);
  const rev=o.payType==='mixed'?(+o.mixCash||0)+(o.amount-(+o.mixCash||0))*(o.mixVia==='halyk'?.77:.85):o.amount*(PAY_F[o.payType]||1);
  return Math.round(rev-c-g-10000);
}

function recalcOrderForm(f,src){

  if(src&&src.name==='dtype'){const x=dtOf(src.value);if(x){const setR=(n,v)=>{const el=f.querySelector(`input[name="${n}"][value="${v}"]`);if(el)el.checked=true};

    if(x.delivery)setR('delivery',x.delivery);if(x.paid)setR('paid',x.paid)}}
  const r=readOrderForm(f);const c=calcOrder(r);

  if(txt&&r.payType==='cash'&&r.discount)txt+=` → скидка 2% = <b>${nfmt(c.total)}</b>`;
  if(txt&&c.mix)txt+=c.mix.part?` → ${nfmt(c.mix.part)} нал + остаток ${nfmt(c.mix.restCash)} ÷ ${c.mix.via==='halyk'?'0,77':'0,85'} = ${nfmt(c.mix.inst)} в рассрочку ${viaName(c.mix.via)} (от ${nfmt(c.mix.m24)}/мес) · итого <b>${nfmt(c.total)}</b>`:' → впишите, сколько наличными';

  f.querySelectorAll('[data-show="custom"]').forEach(el=>el.hidden=!(k?.custom));
  f.querySelectorAll('[data-show="cityOther"]').forEach(el=>el.hidden=r.pick!=='other');

  const rest=f.querySelector('#of-rest');if(rest)rest.textContent=money(due);

}

  if(step==='pay')return `${head(`Оплата №${esc(o.num)}`,`К оплате ${money(dueOf(o))}${o.paid==='partial'?` (оплачено ${money(o.prepaid)})`:''}`)}<form class="form" data-form="courPay" data-id="${esc(id)}"><div class="field"><label for="cp-a">Сколько принято, ₸</label><input class="inp num" id="cp-a" name="amount" inputmode="numeric" required value="${esc(dueOf(o)||'')}"></div><div class="field"><label for="cp-m">Как</label><select class="inp" id="cp-m" name="method">${['Наличные','Kaspi перевод','Kaspi QR','Halyk'].map(x=>opt(x,x)).join('')}</select></div><button class="btn primary" type="submit">Принял оплату</button></form>`;
  if(step==='hand')return `${head(`Сдать деньги №${esc(o.num)}`,`${money(c.paidAmount)} · ${esc(c.paidMethod||'')}`)}<form class="form" data-form="courHand" data-id="${esc(id)}"><div class="field"><label for="chm">Как передали</label><select class="inp" id="chm" name="method">${['Перевод на Kaspi Gold компании','Наличными Адилю','В кассу шоурума','Деньги сразу ушли на счёт компании'].map(x=>opt(x,x)).join('')}</select></div><div class="field"><label for="chn">Комментарий</label><input class="inp" id="chn" name="note" placeholder="кому, номер чека"></div><button class="btn primary" type="submit">Деньги переданы</button></form>`;
  return null};

ACT.importData=()=>{const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';inp.onchange=async()=>{const f=inp.files[0];if(!f)return;
  try{const data=JSON.parse(await f.text());let n=0;let b=S.db.batch();let c=0;
    for(const [colName,docs] of Object.entries(data)){for(const [id,d] of Object.entries(docs)){b.set(S.db.doc(colName+'/'+id),d);c++;n++;if(c>=400){await b.commit();b=S.db.batch();c=0}}}
    if(c)await b.commit();toast('Импортировано записей: '+n);closeSheet()}catch(e){toast('Ошибка импорта: '+(e.message||e.code))}};inp.click()};
ACT.setBg=()=>{const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=()=>{const f=inp.files[0];if(!f)return;const img=new Image();img.onload=()=>{
  const m=1600,k=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  let q=.82,u=c.toDataURL('image/jpeg',q);while(u.length>1.8e6&&q>.4){q-=.12;u=c.toDataURL('image/jpeg',q)}
  try{localStorage.setItem('teb.bg',u);applyBg();toast('Фон установлен');openSheet('theme')}catch(e){toast('Фото слишком большое — выберите другое')}URL.revokeObjectURL(img.src)};img.onerror=()=>toast('Не получилось открыть фото');img.src=URL.createObjectURL(f)};inp.click()};

async function upload(input){
  const o=S.orders.find(x=>x.id===input.dataset.id);if(!o||!S.assets)return;
  const files=[...input.files];input.value='';if(!files.length)return;
  const added=[];
  for(const f of files){
    toast(`Загружаю ${added.length+1} из ${files.length}…`);
    try{const r=await S.assets.upload(f);added.push({id:r.id,type:r.contentType,at:Date.now(),by:whoId()})}catch(e){toast(errText(e));}
  }
  if(added.length){const fresh=S.orders.find(x=>x.id===o.id)||o;if(await upd(doc('orders/'+o.id),{media:[...(fresh.media||[]),...added]}))toast(`Загружено: ${added.length}`)}
}

document.addEventListener('submit',e=>{const f=e.target;if(!f.dataset.form)return;e.preventDefault();const h=FORM[f.dataset.form];if(!h)return;
  const b=f.querySelector('button[type="submit"]');if(b){if(b.disabled)return;b.disabled=true}
  Promise.resolve(h(new FormData(f),f)).finally(()=>{if(b&&b.isConnected)b.disabled=false})});

  const of=e.target.closest&&e.target.closest('form[data-form="order"]');if(of){recalcOrderForm(of,e.target);return}const k=e.target.dataset?.input;if(!k)return;S.f[k]=e.target.value;clearTimeout(inT);inT=setTimeout(paint,180)});
document.addEventListener('change',e=>{
  const pl=e.target.dataset?.pl;if(pl){const m=e.target.dataset.m,k=e.target.dataset.k;const days={...(S.paylog[m]||{})};const cur={...(days[k]||{})};if(pl==='w')cur.w=e.target.checked?1:0;else cur.sales=num(e.target.value)||0;days[k]=cur;S.paylog[m]=days;put(doc('paylog/'+m),{days}).then(ok=>ok&&toast('Сохранено'));setTimeout(schedulePaint,0);return}
  if(e.target.dataset?.mix==='via'){S.calc.mixVia=e.target.value;paint();return}
  const grp=e.target.dataset?.group;
  if(grp&&e.target.checked&&UP_EXCL.includes(grp)){const scope=e.target.closest('form')||e.target.closest('.view')||document;
    scope.querySelectorAll(`input[data-group="${CSS.escape(grp)}"]`).forEach(x=>{if(x!==e.target)x.checked=false})}
  const ca=e.target.dataset?.calc;if(ca){if(ca==='kit'){if(!e.target.value)return;S.calc.kitId=e.target.value;S.calc.ups=[]}else if(ca==='disc')S.calc.discount=e.target.checked;else{let s=new Set(S.calc.ups);if(e.target.checked){if(UP_EXCL.includes(grp))s=new Set([...s].filter(id=>(upOf(id)?.group||'Прочее')!==grp));s.add(e.target.value)}else s.delete(e.target.value);S.calc.ups=[...s]}paint();return}const of=e.target.closest&&e.target.closest('form[data-form="order"]');if(of&&e.target.name!=='amount')recalcOrderForm(of,e.target);const k=e.target.dataset?.change;if(k==='viewAs'){S.viewAs=e.target.value==='admin'?null:e.target.value;try{localStorage.setItem('teb.viewAs',S.viewAs||'')}catch(x){}S.tab=null;closeSheet();paint()}else if(k==='upload')upload(e.target)});
window.addEventListener('scroll',()=>{if(S.tab==='chat'||S.tab==='mchat')S._chatStick=(window.innerHeight+window.scrollY)>=document.body.scrollHeight-80},{passive:true});
setInterval(()=>{if(S.ready&&!S.sheet)paint()},60000);

boot();
</script>
