<style>

:root{

.bigimg{width:100%;max-height:300px;object-fit:contain;border-radius:12px;background:var(--sunk)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--mut)}.kv dd{margin:0;text-align:right;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:40;max-width:calc(100% - 32px)}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 12px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.msg.u{align-self:flex-end;background:var(--acc);color:var(--acc-fg);border-bottom-right-radius:4px}

.composer{display:flex;gap:8px;align-items:flex-end}

.muted{color:var(--mut)}.small{font-size:13px}
.sale-day{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;color:var(--mut);font-weight:700;margin-top:6px}
.right{text-align:right}
.loading{color:var(--mut);padding:30px 0;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const num=v=>{const x=parseFloat(String(v==null?'':v).replace(/\s/g,'').replace(',','.'));return isFinite(x)?x:null};
const pad=n=>String(n).padStart(2,'0');
const dayKey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const today=()=>dayKey(Date.now());
const MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const dfmt=k=>{if(!k)return '';const [y,m,d]=k.split('-');return +d+' '+MON[+m-1]+(y!=String(new Date().getFullYear())?' '+y:'')};
const tsfmt=ts=>ts?dfmt(dayKey(ts))+', '+pad(new Date(ts).getHours())+':'+pad(new Date(ts).getMinutes()):'';
const rate=()=>+S.cfg.rate||70;const fee=()=>S.cfg.fee==null?3:+S.cfg.fee;
const withFee=cny=>(+cny||0)*(1+fee()/100);
const cnyToTg=cny=>withFee(cny)*rate();
const orderUnitCost=o=>Math.round(cnyToTg(o.priceCny)+((+o.delivery||0)/Math.max(1,+o.qty||1)));
const imgUrl=id=>id?(String(id).startsWith('data:')?id:'/_blob/'+encodeURIComponent(id)):'';
function modelName(d){
  const base=(d.name||'').trim();
  if(d.cat==='ram'){const parts=['DDR5',d.gb?d.gb+'GB':'',d.mhz?d.mhz:'',d.cl?'CL'+d.cl:''].filter(Boolean).join(' ');return (base?base+' ':'')+parts}
  return base||'Без названия'}
const keyOf=d=>(d.cat+'|'+modelName(d)).toLowerCase().replace(/\s+/g,' ').trim();
function toast(t){const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2400)}
function inPeriod(dk,p){if(p==='all')return true;const n=+p;const from=new Date();from.setHours(0,0,0,0);from.setDate(from.getDate()-(n-1));return dk>=dayKey(from.getTime())}

/* ---------- data layer ---------- */
const col=n=>db.collection(n);
async function put(path,data){try{await db.doc(path).set(data);return true}catch(e){fail(e);return false}}
async function upd(path,data){try{await db.doc(path).update(data);return true}catch(e){fail(e);return false}}
async function del(path){try{await db.doc(path).delete();return true}catch(e){fail(e);return false}}
async function add(c,data){try{const r=await col(c).add(data);return r.id}catch(e){fail(e);return null}}
function fail(e){const c=e&&e.code;toast(c==='quota_exceeded'?'Хранилище заполнено — удалите старые записи':c==='not_granted'?'Нет прав на запись':c==='resource_exhausted'?'Слишком часто — повторите через секунду':'Не сохранилось, проверьте интернет')}

async function boot(){
  const timer=setTimeout(()=>{if(S.dbOk==null){S.dbOk=false;render()}},10000);
  try{db=await window.claude?.use?.('db')}catch(e){db=null}
  if(!db){clearTimeout(timer);S.dbOk=false;render();return}
  const sub=(name,key)=>col(name).orderBy('createdAt','desc').limit(1000).onSnapshot(s=>{
    clearTimeout(timer);S.dbOk=true;S[key]=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded[key]=true;render()},
    e=>{clearTimeout(timer);S.dbOk=false;render()});
  sub('orders','orders');sub('stock','stock');sub('sales','sales');
  db.doc('config/main').onSnapshot(s=>{const v=s.exists&&s.data();if(v)S.cfg={...S.cfg,...v};render()},()=>{});
  try{assets=await window.claude.use('assets')}catch(e){assets=null}
  try{sampler=await window.claude.use('sample')}catch(e){sampler=null}
  render();
}

/* ---------- Сводка ---------- */
function aggregate(list,keyFn){const m={};list.forEach(s=>{const k=keyFn(s);if(!k)return;const r=m[k]||(m[k]={k,units:0,revenue:0,margin:0,n:0});r.units+=+s.qty||0;r.revenue+=+s.revenue||0;r.margin+=+s.margin||0;r.n++});return Object.values(m)}
function bars(rows,valFn,labelFn,fmt){
  if(!rows.length)return '<div class="muted small">Нет продаж за период.</div>';
  const max=Math.max(...rows.map(valFn),1);
  return `<div class="bars">${rows.map(r=>`<div class="bar"><div class="bl"><b>${esc(labelFn(r))}</b><span class="num">${fmt(r)}</span></div><div class="track"><i style="width:${Math.max(2,valFn(r)/max*100).toFixed(1)}%"></i></div></div>`).join('')}</div>`}
function vStats(){
  const p=S.period;const N=S.topN;
  const list=S.sales.filter(s=>inPeriod(s.date,p));
  const rev=list.reduce((a,s)=>a+(+s.revenue||0),0),mar=list.reduce((a,s)=>a+(+s.margin||0),0),units=list.reduce((a,s)=>a+(+s.qty||0),0);
  const markup=rev-mar>0?mar/(rev-mar)*100:0;
  const items=aggregate(list,s=>s.model).sort((a,b)=>b.units-a.units||b.margin-a.margin).slice(0,N);
  const cities=aggregate(list,s=>s.city||'Не указан').sort((a,b)=>b.n-a.n||b.revenue-a.revenue).slice(0,N);
  const cats=aggregate(list,s=>CATS[s.cat]||'Другое').sort((a,b)=>b.units-a.units);
  const ramCfg=aggregate(list.filter(s=>s.cat==='ram'),s=>[s.gb?s.gb+'GB':'',s.mhz||'',s.cl?'CL'+s.cl:''].filter(Boolean).join(' ')).sort((a,b)=>b.units-a.units).slice(0,N);
  /* chart: by day for short periods, by month for long */
  let chart='';
  if(p!=='1'){
    const byMonth=p==='182'||p==='365'||p==='all';const buckets=[];
    if(byMonth){const months=p==='182'?6:p==='365'?12:Math.max(1,monthsSpan());for(let i=months-1;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);buckets.push([d.getFullYear()+'-'+pad(d.getMonth()+1),MON[d.getMonth()]])}}
    else{const n=+p;for(let i=n-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=dayKey(d.getTime());buckets.push([k,String(d.getDate())])}}
    const vals=buckets.map(([k])=>list.filter(s=>byMonth?String(s.date).startsWith(k):s.date===k).reduce((a,s)=>a+(+s.margin||0),0));
    const max=Math.max(...vals,1);
    chart=`<div class="panel"><div class="row-h"><h2 style="margin:0">Маржа по ${byMonth?'месяцам':'дням'}</h2><span class="spacer"></span><span class="num small muted">макс ${tg(max)}</span></div>
     <div class="cols" role="img" aria-label="Маржа по ${byMonth?'месяцам':'дням'}">${vals.map((v,i)=>`<div class="${v>0?'':'zero'}" style="height:${v>0?Math.max(3,v/max*100).toFixed(1):0}%" title="${esc(buckets[i][1])}: ${tg(v)}"></div>`).join('')}</div>
     <div class="axis"><span>${esc(buckets[0][1])}</span><span>${esc(buckets[buckets.length-1][1])}</span></div></div>`}
  return `<div class="row-h"><h1>Сводка</h1></div>
  <div class="chips" role="group" aria-label="Период">${PERIODS.map(([id,t])=>`<button class="chip" type="button" data-act="period" data-id="${id}" aria-pressed="${p===id}">${t}</button>`).join('')}</div>
  <div class="tiles">
   <div class="tile hero"><div class="l">Чистая маржа</div><div class="v">${tg(mar)}</div></div>
   <div class="tile"><div class="l">Оборот</div><div class="v">${tg(rev)}</div></div>
   <div class="tile"><div class="l">Продаж · штук</div><div class="v">${nf(list.length)} · ${nf(units)}</div></div>
   <div class="tile"><div class="l">Наценка к себестоимости</div><div class="v">${markup.toFixed(1).replace('.',',')}%</div></div></div>
  ${chart}
  <div class="row-h"><h2 style="margin:0">Топ</h2><span class="spacer"></span><div class="chips" role="group" aria-label="Сколько показывать">${[3,5,10].map(n=>`<button class="chip" type="button" data-act="topN" data-id="${n}" aria-pressed="${N===n}">Топ ${n}</button>`).join('')}</div></div>
  <div class="grid2">
   <div class="panel"><h2 style="margin:0 0 10px">Самые продаваемые</h2>${bars(items,r=>r.units,r=>r.k,r=>nf(r.units)+' шт · '+tg(r.margin))}</div>
   <div class="panel"><h2 style="margin:0 0 10px">Города</h2>${bars(cities,r=>r.n,r=>r.k,r=>nf(r.n)+' прод. · '+tg(r.revenue))}</div>
   <div class="panel"><h2 style="margin:0 0 10px">Что чаще выходит</h2>${bars(cats,r=>r.units,r=>r.k,r=>nf(r.units)+' шт · '+tg(r.margin))}</div>
   <div class="panel"><h2 style="margin:0 0 10px">Популярная DDR5</h2>${bars(ramCfg,r=>r.units,r=>r.k||'без характеристик',r=>nf(r.units)+' шт')}</div>
  </div>`}
function monthsSpan(){if(!S.sales.length)return 1;const first=S.sales.reduce((a,s)=>s.date<a?s.date:a,S.sales[0].date);const [y,m]=first.split('-').map(Number);const d=new Date();return (d.getFullYear()-y)*12+(d.getMonth()+1-m)+1}

function aiData(){
  const now=Date.now();const d30=dayKey(now-29*864e5),d90=dayKey(now-89*864e5);
  const per={};S.sales.forEach(s=>{const r=per[s.model]||(per[s.model]={model:s.model,cat:CATS[s.cat]||'',sold_units:0,units_30d:0,units_90d:0,revenue:0,margin:0,first_sale:s.date,last_sale:s.date,cities:{}});
    r.sold_units+=+s.qty||0;if(s.date>=d30)r.units_30d+=+s.qty||0;if(s.date>=d90)r.units_90d+=+s.qty||0;r.revenue+=+s.revenue||0;r.margin+=+s.margin||0;
    if(s.date<r.first_sale)r.first_sale=s.date;if(s.date>r.last_sale)r.last_sale=s.date;const c=s.city||'—';r.cities[c]=(r.cities[c]||0)+(+s.qty||0)});

async function ask(q){
  q=(q||'').trim();if(!q||S.busy||!sampler)return;
  S.chat.push({role:'user',content:q});S.chat.push({role:'assistant',content:''});S.busy=true;S.draft.chat='';render();
  const sys=`Ты — аналитик небольшого бизнеса: владелец покупает компьютерные комплектующие (процессоры, оперативную память DDR5) в Китае и продаёт в Казахстане. Отвечай по-русски, коротко и по делу, с конкретными цифрами из данных ниже (тенге — ₸). Не выдумывай того, чего нет в данных; если данных мало для вывода, так и скажи и предложи, что начать записывать. Советуя, что заказать, учитывай скорость продаж (штук за 30/90 дней), текущий остаток, товар в пути, маржу и срок доставки из Китая. Без markdown-заголовков и таблиц, простым текстом, списки через «—».\n\nДанные (JSON):\n`+JSON.stringify(aiData());
  const msgs=[{role:'user',content:sys+'\n\nВопрос: '+S.chat[0].content}];
  for(let i=1;i<S.chat.length-1;i++)msgs.push({role:S.chat[i].role,content:S.chat[i].content||'…'});
  if(S.chat.length===2)msgs.length=1;
  const out=S.chat[S.chat.length-1];
  try{await sampler(msgs,{cache:false,onText:u=>{out.content=u.text;const els=document.querySelectorAll('.msg.a');const last=els[els.length-1];if(last)last.textContent=u.text}})}
  catch(e){out.content=e&&e.code==='rate_limited'?'Слишком много вопросов подряд — подождите минуту.':e&&e.code==='not_granted'?'Доступ к AI не разрешён для этой страницы.':(e&&e.text)||'Не получилось ответить. Попробуйте ещё раз.'}
  S.busy=false;render()}

async function uploadPhoto(file){
  if(!file||!assets)return null;
  try{
    const bmp=await createImageBitmap(file);const k=Math.min(1,900/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.72));const res=await assets.upload(blob||file);return res.id}
  catch(e){try{const res=await assets.upload(file);return res.id}catch(e2){toast(e2&&e2.code==='too_large'?'Фото слишком большое':'Фото не загрузилось');return null}}}

async function addToStock(o,deliveryOverride){
  const d={cat:o.cat,name:o.name,gb:o.gb,mhz:o.mhz,cl:o.cl};const key=keyOf(d);
  const unit=Math.round(cnyToTg(o.priceCny)+((+deliveryOverride||0)/Math.max(1,+o.qty||1)));
  const ex=S.stock.find(s=>s.key===key);
  if(ex){const q0=+ex.qty||0,q=q0+(+o.qty||0);const cost=q>0?Math.round(((+ex.cost||0)*q0+unit*(+o.qty||0))/q):unit;
    if(await upd('stock/'+ex.id,{qty:q,cost,updatedAt:Date.now(),...(ex.photoId||!o.photoId?{}:{photoId:o.photoId})}))return ex.id;return null}
  return await add('stock',{key,model:o.model,cat:o.cat,name:o.name||'',gb:o.gb||null,mhz:o.mhz||null,cl:o.cl||null,specs:o.specs||'',qty:+o.qty||0,cost:unit,market:null,photoId:o.photoId||null,createdAt:Date.now(),updatedAt:Date.now()})}

  next:async d=>{const o=S.orders.find(x=>x.id===d.id);if(!o)return;const st=+o.stage||0;if(st>=4)return;
    if(st+1===4)return openSheet('receive',o.id);
    if(await upd('orders/'+o.id,{stage:st+1,stageAt:{...(o.stageAt||{}),[st+1]:Date.now()}}))toast(STAGES[st+1])},
  back:async d=>{if(S.armed!=='back'){S.armed='back';renderSheet();return}S.armed=null;const o=S.orders.find(x=>x.id===d.id);if(!o)return;const st=+o.stage||0;if(!st)return;
    if(st===4&&o.stockId){const s=S.stock.find(x=>x.id===o.stockId);if(s)await upd('stock/'+s.id,{qty:Math.max(0,(+s.qty||0)-(+o.qty||0)),updatedAt:Date.now()})}
    const sa={...(o.stageAt||{})};delete sa[st];if(await upd('orders/'+o.id,{stage:st-1,stageAt:sa,...(st===4?{stockId:null}:{})}))toast('Вернули: '+STAGES[st-1])},
  delOrder:async d=>{if(S.armed!=='delOrder'){S.armed='delOrder';renderSheet();return}const o=S.orders.find(x=>x.id===d.id);
    if(o&&(+o.stage||0)===4&&o.stockId){const s=S.stock.find(x=>x.id===o.stockId);if(s)await upd('stock/'+s.id,{qty:Math.max(0,(+s.qty||0)-(+o.qty||0))})}
    if(await del('orders/'+d.id)){closeSheet();toast('Заказ удалён')}},
  delStock:async d=>{if(S.armed!=='delStock'){S.armed='delStock';renderSheet();return}if(await del('stock/'+d.id)){closeSheet();toast('Позиция удалена')}},
  delSale:async d=>{if(S.armed!=='delSale'){S.armed='delSale';renderSheet();return}const s=S.sales.find(x=>x.id===d.id);if(!s)return;
    const st=S.stock.find(x=>x.id===s.stockId);if(st)await upd('stock/'+st.id,{qty:(+st.qty||0)+(+s.qty||0),updatedAt:Date.now()});
    if(await del('sales/'+s.id)){closeSheet();toast('Продажа удалена, товар вернулся на склад')}},
  clearDemo:async()=>{if(S.armed!=='demo'){S.armed='demo';render();return}S.armed=null;
    for(const [c,k] of [['sales','sales'],['orders','orders'],['stock','stock']])for(const x of S[k].filter(x=>x.demo))await del(c+'/'+x.id);toast('Примеры удалены')},
  ask:d=>ask(d.q),chatClear:()=>{S.chat=[];render()}
};
document.addEventListener('click',ev=>{const t=ev.target.closest('[data-act]');if(!t||t.disabled)return;const fn=ACT[t.dataset.act];if(!fn)return;
  if(t.dataset.act==='scrim'&&ev.target!==t)return;ev.preventDefault();fn(t.dataset,{...ev,target:ev.target,currentTarget:t})});
document.addEventListener('input',ev=>{const t=ev.target;
  if(t.dataset.input){S[t.dataset.input]=t.value;render();return}
  if(t.id==='chatIn'){S.draft.chat=t.value;return}
  if(t.closest('form[data-form=order]'))calcOrder();if(t.closest('form[data-form=sale]'))calcSale()});
document.addEventListener('change',ev=>{if(ev.target.closest('form[data-form=sale]')&&ev.target.name==='stockId'){const s=S.stock.find(x=>x.id===ev.target.value);const pr=document.getElementById('sl-price');if(s&&pr){pr.value=s.market||'';pr.placeholder=s.cost||''}calcSale()}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&S.sheet)closeSheet();if(ev.key==='Enter'&&!ev.shiftKey&&ev.target.id==='chatIn'){ev.preventDefault();ask(ev.target.value)}});
document.addEventListener('submit',async ev=>{const f=ev.target;ev.preventDefault();const kind=f.dataset.form;const fd=new FormData(f);
  if(kind==='chat'){ask(fd.get('q'));return}
  const btn=f.querySelector('[type=submit]');if(btn)btn.disabled=true;const done=()=>{if(btn)btn.disabled=false};
  if(kind==='order'){
    const cat=fd.get('cat');const d={cat,name:(fd.get('name')||'').trim(),gb:cat==='ram'?+fd.get('gb'):null,mhz:cat==='ram'?+fd.get('mhz'):null,cl:cat==='ram'?+fd.get('cl'):null,specs:(fd.get('specs')||'').trim()};
    const price=num(fd.get('priceCny'));const qty=Math.round(num(fd.get('qty'))||0);
    if(cat!=='ram'&&!d.name){done();return toast('Укажите модель')}
    if(price==null||price<=0){done();return toast('Укажите цену в юанях')}
    if(qty<1){done();return toast('Укажите количество')}
    const file=f.photo.files&&f.photo.files[0];let photoId;if(file){toast('Загружаем фото…');photoId=await uploadPhoto(file)}
    const data={...d,model:modelName(d),track:(fd.get('track')||'').trim(),priceCny:price,qty,note:(fd.get('note')||'').trim(),...(photoId?{photoId}:{})};
    const id=f.dataset.id;
    if(id){if(await upd('orders/'+id,data)){toast('Сохранено');openSheet('orderView',id)}done();return}
    const now=Date.now();const nid=await add('orders',{...data,photoId:photoId||null,stage:0,stageAt:{0:now},delivery:null,createdAt:now});
    if(nid){S.tab='orders';S.stageF='active';closeSheet();render();toast('Заказ добавлен')}done();return}
  if(kind==='receive'){
    const o=S.orders.find(x=>x.id===f.dataset.id);if(!o){done();return}const dl=Math.round(num(fd.get('delivery'))||0);
    if((+o.stage||0)===4){ // only delivery changed
      const delta=dl-(+o.delivery||0);const s=o.stockId&&S.stock.find(x=>x.id===o.stockId);
      if(s&&delta&&+s.qty>0)await upd('stock/'+s.id,{cost:Math.round((+s.cost||0)+delta/Math.max(+s.qty,1)),updatedAt:Date.now()});
      if(await upd('orders/'+o.id,{delivery:dl}))toast('Доставка сохранена');openSheet('orderView',o.id);done();return}
    const sid=await addToStock(o,dl);
    if(sid&&await upd('orders/'+o.id,{stage:4,delivery:dl,stockId:sid,stageAt:{...(o.stageAt||{}),4:Date.now()}})){toast('Забрал — товар на складе');openSheet('orderView',o.id)}done();return}
  if(kind==='stock'){
    const cat=fd.get('cat');const d={cat,name:(fd.get('name')||'').trim(),gb:cat==='ram'?+fd.get('gb'):null,mhz:cat==='ram'?+fd.get('mhz'):null,cl:cat==='ram'?+fd.get('cl'):null,specs:(fd.get('specs')||'').trim()};
    if(cat!=='ram'&&!d.name){done();return toast('Укажите модель')}
    const qty=Math.round(num(fd.get('qty'))||0),cost=Math.round(num(fd.get('cost'))||0),market=num(fd.get('market'));
    if(!cost){done();return toast('Укажите себестоимость')}
    const data={...d,model:modelName(d),key:keyOf(d),qty,cost,market:market==null?null:Math.round(market),updatedAt:Date.now()};
    const id=f.dataset.id;
    if(id){if(await upd('stock/'+id,data)){closeSheet();toast('Сохранено')}done();return}
    const dup=S.stock.find(s=>s.key===data.key);if(dup){done();return toast('Такая позиция уже есть — откройте её и измените количество')}
    if(await add('stock',{...data,photoId:null,createdAt:Date.now()})){closeSheet();toast('Добавлено на склад')}done();return}
  if(kind==='sale'){
    const s=S.stock.find(x=>x.id===fd.get('stockId'));if(!s){done();return}
    const qty=Math.round(num(fd.get('qty'))||0),price=Math.round(num(fd.get('price'))||0);
    if(qty<1){done();return toast('Укажите количество')}if(qty>+s.qty){done();return toast('На складе только '+nf(s.qty)+' шт')}
    if(!price){done();return toast('Укажите цену продажи')}
    const cost=+s.cost||0;
    const sale={stockId:s.id,model:s.model,cat:s.cat,gb:s.gb||null,mhz:s.mhz||null,cl:s.cl||null,qty,price,cost,revenue:price*qty,margin:(price-cost)*qty,
      name:(fd.get('name')||'').trim(),phone:(fd.get('phone')||'').trim(),city:(fd.get('city')||'').trim(),note:(fd.get('note')||'').trim(),date:fd.get('date')||today(),createdAt:Date.now()};
    if(await upd('stock/'+s.id,{qty:(+s.qty||0)-qty,updatedAt:Date.now()})){
      if(await add('sales',sale)){closeSheet();toast('Продажа сохранена · маржа '+tg(sale.margin))}
      else await upd('stock/'+s.id,{qty:+s.qty})}
    done();return}
  if(kind==='settings'){const r=num(fd.get('rate')),fe=num(fd.get('fee'));if(!r||r<=0){done();return toast('Укажите курс')}
    if(await put('config/main',{rate:r,fee:fe==null?3:fe,updatedAt:Date.now()})){closeSheet();toast('Курс сохранён')}done();return}
});

render();boot();
</script>
